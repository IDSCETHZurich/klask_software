/**:
  ros__parameters:
    # Model configuration
    weights_filename: "r3wvqils_sprite_128_5M_inference.pt" # Name of the model file to load from nn_weights folder
    weights_zip_url: "https://polybox.ethz.ch/index.php/s/joEoP8GgQbwmToW/download" # URL to download weights zip
    device: "cuda" # Options: "cpu", "cuda"

    # Board configuration
    board_width: 0.42 # meters
    board_height: 0.32 # meters

    # Player configuration
    player_side: "left" # Options: "left", "right" - will be overridden by launch file

    # Agent type selection
    agent_type: "dreamer" # Options: "ppo", "dreamer"
    dreamer_config_filename: "" # Config JSON filename in nn_weights folder (empty = <checkpoint_stem>_config.json)
    debug_view: true # If true, show the rotated ego-view image in an OpenCV window (Dreamer only)
    opponent_action_mode: "zero" # Opponent action source for separated-opponent Dreamer (Dreamer only): "zero" | "random" | "estimator" | "overhear". Ignored when checkpoint was not trained with opponent_separation.
    opponent_cmd_vel_topic: "" # Topic to overhear when opponent_action_mode="overhear". Empty = auto-derive by swapping "left_player" <-> "right_player" in cmd_vel_topic.
    opponent_cmd_vel_stale_threshold: 0.2 # Seconds; opponent cmd_vel older than this is treated as missing (zeros fallback).

    # Action rescaling configuration (PPO only)
    clip_actions: 0.4 # Action clipping bound
    enable_action_rescaling: true # Enable action rescaling from [-1,1] to [-clip_actions, clip_actions]

    # State machine configuration
    interaction_delay: 2.0 # Delay in seconds befor continuing after the user interacted with the board

    # Motor commander configuration
    motor_commander_namespace: "/motor_commander" # Namespace for motor commander services
    calibrate_encoders_service_name: "calibrate_encoders" # Service name for encoder calibration
    get_calibration_status_service_name: "get_calibration_status" # Service name for checking calibration
    is_player_homed_service_name: "is_player_homed" # Service name to check if peg is homed
    home_peg_action_name: "home_peg" # Action name for homing peg
    home_and_calibrate_action_name: "home_and_calibrate" # Action name for combined home and calibrate

    # ROS topic configuration
    state_topic: "/board_state"
    image_topic: "/board_image/downscaled/compressed" # Camera topic for Dreamer agent
    cmd_vel_topic: "/cmd_vel/left_player" # Will be overridden by launch file

    # QoS settings
    subscription_queue_size: 1
    publisher_queue_size: 1

    # Motor Commander watchdog configuration
    heartbeat_topic: "/motor_commander/heartbeat" # Topic to monitor for motor commander heartbeat
    heartbeat_timeout: 1.5 # Timeout in seconds to consider motor commander unresponsive
