/**:
  ros__parameters:
    # ============================================
    # Debug and Display Parameters
    # ============================================

    show_image: false # Enable visualization windows (default: false)

    # ============================================
    # Pixel to Engineering Units (EU) Conversion
    # ============================================
    # Board physical dimensions in meters
    board_width_meters: 0.42 # Physical board width (default: 0.42m)
    board_height_meters: 0.32 # Physical board height (default: 0.32m)
    # Board pixel dimensions are determined automatically from the received
    # cropped/warped camera image. Conversion factors are computed as:
    # pixel_to_meter_x = board_width_meters / image_width
    # pixel_to_meter_y = board_height_meters / image_height

    # ============================================
    # Goal Detection Parameters
    # ============================================

    goal_radius: 25 # Radius around goal center to count as "in goal" (pixels) (default: 25)
    goal_hyst_counter: 30 # Frames required before confirming goal (default: 30)

    # ============================================
    # Collision Detection Parameters
    # ============================================

    collision_distance: 35.0 # Distance threshold for edge/peg collision logic (pixels) (default: 35.0)

    # ============================================
    # HSV Color Ranges
    # ============================================
    # Each is [H, S, V] with integer values

    ball_hsv_lower: [10, 60, 200] # Orange ball lower bound
    ball_hsv_upper: [45, 160, 255] # Orange ball upper bound

    peg_hsv_lower: [90, 150, 0] # Black peg lower bound
    peg_hsv_upper: [130, 255, 45] # Black peg upper bound

    # ============================================
    # Visualization Canvas
    # ============================================

    canvas_width: 1280 # Visualization canvas width in pixels (default: 1280)
    canvas_height: 720 # Visualization canvas height in pixels (default: 720)

    # ============================================
    # Timing
    # ============================================

    publish_frequency: 50.0 # State publishing frequency in Hz (default: 50.0)
    display_update_interval: 0.1 # Seconds between display updates (default: 0.1)

    # ============================================
    # Topics
    # ============================================

    board_state_topic: "board_state" # State output topic (default: "board_state")
    board_image_topic: "board_image/compressed" # Input image topic (default: "board_image/compressed")
    goal_positions_topic: "goal_positions" # Input goal positions topic (default: "goal_positions")

    # ============================================
    # Kalman Filter Parameters
    # ============================================

    ball_kf_process_noise_position: 2.0
    ball_kf_process_noise_velocity: 30.0
    ball_kf_measurement_noise_position: 1.0

    left_peg_kf_process_noise_position: 2.0
    left_peg_kf_process_noise_velocity: 800.0
    left_peg_kf_measurement_noise_position: 12.0
    left_peg_kf_stop_threshold: 0.3

    right_peg_kf_process_noise_position: 2.0
    right_peg_kf_process_noise_velocity: 800.0
    right_peg_kf_measurement_noise_position: 12.0
    right_peg_kf_stop_threshold: 0.3

    # ============================================
    # Playing Field Boundaries
    # ============================================
    # Used by collision detection logic: [x_min, x_max, y_min, y_max]

    edge_x_min: 0.0
    edge_x_max: 530.0
    edge_y_min: 0.0
    edge_y_max: 370.0
